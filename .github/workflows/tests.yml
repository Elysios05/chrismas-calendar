name: Vérifications

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rls:
    # Teste la migration SQL et les règles d'accès sur un Postgres local jetable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run_sql_tests.sh
