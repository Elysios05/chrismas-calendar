name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Version privée (racine du site) : branchée sur Supabase si les secrets existent,
      # sinon elle retombe sur le mode démo. Voir docs/supabase.md.
      # Repli : clé publishable et clé VAPID publique du projet d'Alexandre (publiques par nature,
      # elles finissent de toute façon dans le JavaScript du site).
      - name: Build version privée
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_OWfucaz2x0nO5TUi_Hm5Zw_GCmKDe2Q' }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY || 'BDqHsPKRJgs9fVpARgKVwa1sUyEgY_6lx1ns7PoUjK5ig8q4ru6VZNu6ydfG3L1vRXrktt89uHkUu_pn7-UuQGo' }}
      # Version démo publique, sans backend, dans le sous-dossier /demo/
      - name: Build version démo
        run: npx vite build --outDir dist/demo --emptyOutDir
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
